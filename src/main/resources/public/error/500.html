<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ6H7g3TQ9R6G7enl53hUPRmMlFoh5qa49chhA1Jp5cblc0TQOqRR5W8bXZ" crossorigin="anonymous">
  <style>
    body {
        background-color: #f8f9fa;
        font-family: 'Arial', sans-serif;
    }
    .error-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .error-message {
        background-color: #ffffff;
        padding: 50px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .error-message h1 {
        font-size: 100px;
        font-weight: bold;
        color: #e74c3c;
    }
    .error-message p {
        font-size: 20px;
        margin: 20px 0;
    }
    .btn-go-home {
        font-size: 18px;
        padding: 10px 20px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        text-decoration: none;
    }
    .btn-go-home:hover {
        background-color: #2980b9;
    }
  </style>
</head>
<body>

<div class="error-container">
  <div class="error-message">
    <h1>500 Internal Server Error</h1>
    <p>Sorry, something went wrong on our end. Please try again later.</p>
  </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-ZvpUoO/+PpL7k8vYIEn+7p9C7cSZX7zZ0GfKrSikV+dZXtK20k0HqZyJpdYwl6pF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0ZnCq5x7i3a5wQlf23F0gRNNh4tAi8BO1zRUthtqU3bdW+8V" crossorigin="anonymous"></script>

</body>
</html>

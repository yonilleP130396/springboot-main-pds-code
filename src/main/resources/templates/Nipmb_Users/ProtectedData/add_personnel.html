  <!--rankwithoutrating:script for dropdown-->
  <script>
    // Fetch the ranks from the Spring Boot REST API
    fetch('/api/rank')
      .then(response => response.json())
      .then(data => {
        let ranks = data;
        let rankSelect = document.getElementById("rank");

        // Populate the dropdown with rank names and rank codes
        ranks.forEach(rank => {
          let option = document.createElement("option");
          option.value = rank.name;
          option.textContent = rank.name;
          rankSelect.appendChild(option);
        });
      });

    function updateRankWithoutRating() {
      var selectedRank = document.getElementById("rank").value;

      fetch('/api/rank')
        .then(response => response.json())
        .then(ranks => {
          for (var i = 0; i < ranks.length; i++) {
            if (ranks[i].name === selectedRank) {
              document.getElementById("rankwithoutrating").value = ranks[i].rankwithoutrating;
              document.getElementById("rankcode").value = ranks[i].rankcode; // set rankcode
              break;
            }
          }
        });
    }
  </script>

  <!--end:rankwithoutrating:script for dropdown-->
  <!--compulsary retirement-->
  <script>
    // Function to calculate the compulsory retirement date
    function calculateDate() {
      var birthday = document.getElementById("birthdate").value;
      if (birthday) {
        var birthDate = new Date(birthday);
        birthDate.setFullYear(birthDate.getFullYear() + 57);  // Adding 57 years
        var newDate = birthDate.toISOString().split('T')[0];  // Format the date as YYYY-MM-DD
        document.getElementById("compulsoryRetirement").value = newDate;  // Set the result in the input field
      }
    }

    // Add an event listener to the birthday field for the 'change' event
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("birthdate").addEventListener("change", function () {
        calculateDate();
      });
    });
  </script>
  <!--end:compulsary retirement-->


  <!--Start: Script for getting for place api -->
  <script th:inline="javascript">
    let regionCode = /*[[${personnel.region} ?: '']]*/ '';
    let provinceCode = /*[[${personnel.province} ?: '']*/ '';
    let municipalityCode = /*[[${personnel.municipality} ?: '']*/ '';
    let barangayCode = /*[[${personnel.barangay} ?: '']*/ '';



    // Load regions from PSGC API
    function loadRegions() {
      return fetch("https://psgc.gitlab.io/api/regions.json")
        .then(response => response.json())
        .then(data => {
          const regionDropdown = document.getElementById("regionDropdown");
          regionDropdown.innerHTML = "<option value=''>Select a region...</option>";
          data.forEach(region => {
            const option = document.createElement("option");
            option.value = region.code;
            option.text = `${region.regionName}`;
            regionDropdown.appendChild(option);
          });
        });
    }

    function loadProvinces() {
      const regionCode = document.getElementById("regionDropdown").value;
      const provinceDropdown = document.getElementById("provinceDropdown");
      const municipalityDropdown = document.getElementById("municipalityDropdown");
      const barangayDropdown = document.getElementById("barangayDropdown");

      provinceDropdown.innerHTML = "<option value=''>Select a province...</option>";
      municipalityDropdown.innerHTML = "<option value=''>Select a municipality...</option>";
      barangayDropdown.innerHTML = "<option value=''>Select a barangay...</option>";

      if (regionCode === "130000000") {
        return fetch(`https://psgc.gitlab.io/api/regions/${regionCode}/cities.json`)
          .then(response => response.json())
          .then(data => {
            const municipalityDropdown = document.getElementById("municipalityDropdown");
            municipalityDropdown.innerHTML = "<option value=''>Select a municipality...</option>";
            data.forEach(city => {
              const option = document.createElement("option");
              option.value = city.code;
              option.text = city.name;
              municipalityDropdown.appendChild(option);
            });
          });
      } else {
        return fetch(`https://psgc.gitlab.io/api/regions/${regionCode}/provinces.json`)
          .then(response => response.json())
          .then(data => {
            data.forEach(province => {
              const option = document.createElement("option");
              option.value = province.code;
              option.text = province.name;
              provinceDropdown.appendChild(option);
            });
          });
      }
    }

    function loadMunicipalities() {
      const provinceCode = document.getElementById("provinceDropdown").value;
      const municipalityDropdown = document.getElementById("municipalityDropdown");
      const barangayDropdown = document.getElementById("barangayDropdown");

      municipalityDropdown.innerHTML = "<option value=''>Select a municipality...</option>";
      barangayDropdown.innerHTML = "<option value=''>Select a barangay...</option>";

      if (provinceCode) {
        return fetch(`https://psgc.gitlab.io/api/provinces/${provinceCode}/cities-municipalities.json`)
          .then(response => response.json())
          .then(data => {
            data.forEach(municipality => {
              const option = document.createElement("option");
              option.value = municipality.code;
              option.text = municipality.name;
              municipalityDropdown.appendChild(option);
            });
          });
      }

      return Promise.resolve(); // fallback
    }

    function loadBarangays() {
      const municipalityCode = document.getElementById("municipalityDropdown").value;
      const barangayDropdown = document.getElementById("barangayDropdown");

      barangayDropdown.innerHTML = "<option value=''>Select a barangay...</option>";

      if (municipalityCode) {
        return fetch(`https://psgc.gitlab.io/api/cities-municipalities/${municipalityCode}/barangays.json`)
          .then(response => response.json())
          .then(data => {
            data.forEach(barangay => {
              const option = document.createElement("option");
              option.value = barangay.code;
              option.text = barangay.name;
              barangayDropdown.appendChild(option);
            });
          });
      }

      return Promise.resolve();
    }


    // Load regions on page load
    window.onload = function () {
      loadRegions().then(() => {
        const savedRegion = document.getElementById("savedRegion").value;
        if (savedRegion) {
          document.getElementById("regionDropdown").value = savedRegion;
          loadProvinces().then(() => {
            const savedProvince = document.getElementById("savedProvince").value;
            if (savedProvince) {
              document.getElementById("provinceDropdown").value = savedProvince;
              loadMunicipalities().then(() => {
                const savedMunicipality = document.getElementById("savedMunicipality").value;
                if (savedMunicipality) {
                  document.getElementById("municipalityDropdown").value = savedMunicipality;
                  loadBarangays().then(() => {
                    const savedBarangay = document.getElementById("savedBarangay").value;
                    if (savedBarangay) {
                      document.getElementById("barangayDropdown").value = savedBarangay;
                    }
                  });
                }
              });
            }
          });
        }
      });
    };


  </script>
  <!--End:: Script for getting for place api -->

                    <!--begin::Row-->

                      <div class="col-md-4">

                    </div>

                          <th:block th:each="unit : ${units}">

                          </th:block>
                        </select>
                      </div>

                      <div class="col-md-4">

                        <select class="form-select" id="subunit" name="subunit" required>
                          <option selected value="">Choose...</option>
                          <th:block th:each="subunit : ${subunit}">
                            <option th:value="${subunit.id}" th:text="${subunit.name}"

                            </option>
                          </th:block>
                        </select>
                      </div>
                      <div class="col-md-4">

                        <div class="input-group has-validation">
                          <input type="text" th:field="*{otherSubunit}" id="otherSubunit" class="form-control"

                    </div>
                    <div class="row g-3">

                      <div class="col-md-4">

<script>
  window.addEventListener("DOMContentLoaded", function () {
  
      function checkAfpsn() {
          let input = document.getElementById("afpsn");
          let value = input.value.trim();
  
          let staffDiv = document.getElementById("staffSpecialization").closest(".col-md-6");
          let subDiv = document.getElementById("subSpecialization").closest(".col-md-6");
  
          if (value.length > 0) {
              let firstChar = value.charAt(0);
  
              if (!isNaN(firstChar)) {
                  staffDiv.style.display = "none";
                  subDiv.style.display = "block";
              } 
              else if (firstChar.toLowerCase() === 'o') {
                  subDiv.style.display = "none";
                  staffDiv.style.display = "block";
              } 
              else {
                  staffDiv.style.display = "block";
                  subDiv.style.display = "block";
              }
          } else {
              staffDiv.style.display = "block";
              subDiv.style.display = "block";
          }
      }
  
      let afpsnInput = document.getElementById("afpsn");
  
      // run agad pag load
      checkAfpsn();
  
      // listeners
      afpsnInput.addEventListener("input", checkAfpsn);
      afpsnInput.addEventListener("change", checkAfpsn);
  
  });
  </script>

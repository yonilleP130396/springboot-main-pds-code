<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/nipds/src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="/nipds/src/custom.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Naval Intelligence Personnel Database System</title>
</head>

<body class="flex flex-col bg-white transition-colors duration-300 min-h-screen overflow-hidden">

    <!-- Main Layout -->
    <div class="flex flex-row h-screen">

        <!-- Sidebar -->
        <aside id="sidebar"
            class="w-72 hidden border lg:flex flex-col border-gray-200 h-full transition-all duration-300">
            <div class="border-gray-200 flex gap-2 px-3 py-2 items-center">
                <img src="/nipds/src/assets/nisflogo.png" class="h-13" alt="">
                <p class="text-sm font-medium text-slate-800">Naval Intelligence Personnel Database System</p>
            </div>

            <!-- divider -->
            <div class="border-b mx-5 my-2 border-slate-200"></div>

            <!-- Sidebar Items -->

            <div class="flex flex-col overflow-auto">
                <div class="px-4">
                    <p class="text-xs font-bold text-slate-700 p-2 uppercase tracking-wider">Main</p>
                    <!-- <p class="text-slate-400">Main</p> -->
                    <ul id="menu"></ul>
                </div>
            </div>

            <!-- divider -->
            <div class="border-b m-5 border-slate-200"></div>

            <div class="flex flex-col overflow-auto">
                <div class="px-4">
                    <p class="text-xs font-bold text-slate-700 p-2 uppercase tracking-wider">Inventory</p>
                    <!-- <p class="text-slate-400">Main</p> -->
                    <ul id="subMenu"></ul>
                </div>
            </div>
        </aside>

        <main class="flex flex-col flex-1 h-full">
            <!-- Navbar -->
            <nav class="px-5 py-3 sticky top-0 z-50 border-b border-gray-200 tex-lg bg-white">
                <div class="flex flex-row justify-between mr-3">
                    <div class="flex items-center gap-3">
                        <button id="toggleBtn"
                            class="flex items-center text-gray-500 hover:bg-gray-100 p-2 rounded-lg cursor-pointer transition-all duration-300"></button>
                    </div>

                    <div class="hidden md:flex items-center">
                        <button
                            class="px-4 py-2 gap-2 flex items-center rounded-md mr-2 text-sm bg-gradient-to-tr from-zinc-800 to-blue-900 text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-circle-plus-icon lucide-circle-plus">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M8 12h8" />
                                <path d="M12 8v8" />
                            </svg>
                            Add New
                        </button>

                        <button id="fullscreenBtn"
                            class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg cursor-pointer transition-all duration-300">
                            <span id="fullscreenIcon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-expand-icon lucide-expand">
                                    <path d="m15 15 6 6" />
                                    <path d="m15 9 6-6" />
                                    <path d="M21 16v5h-5" />
                                    <path d="M21 8V3h-5" />
                                    <path d="M3 16v5h5" />
                                    <path d="m3 21 6-6" />
                                    <path d="M3 8V3h5" />
                                    <path d="M9 9 3 3" />
                                </svg>
                            </span>
                        </button>

                        <button
                            class="flex items-center text-gray-500 hover:bg-gray-100 p-2 rounded-lg cursor-pointer transition-all duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell">
                                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9">
                                </path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0">
                                </path>
                            </svg>
                        </button>

                        <button
                            class="flex items-center text-gray-500 hover:bg-gray-100 p-2 rounded-lg cursor-pointer transition-all duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings">
                                <path
                                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>

                        <button class="border-l border-gray-200 pl-3 flex flex-row items-center ml-1">
                            <div
                                class="h-8 w-8 rounded-full bg-gradient-to-tr from-blue-500 to-blue-400 flex items-center justify-center text-white text-md font-semibold shadow-sm">
                                P
                            </div>
                            <span class="ml-2 text-sm font-medium text-slate-800">Palomo, Yonnile</span>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Iframe Content -->
            <div class="flex-1 overflow-y-auto">
                <iframe th:src="@{/user/protecteddata/mainpage}" name="contentFrame" frameborder="0" class="w-full h-full"></iframe>
            </div>

        </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="/nipds/src/js/Sidebar.js"></script>
    <script src="/nipds/src/js/Global.js"></script>
</body>

</html>

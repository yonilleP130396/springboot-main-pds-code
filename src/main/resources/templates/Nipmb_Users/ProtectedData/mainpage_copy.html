<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Dashboard</title>

    <!-- Tailwind CSS -->
    <link href="/nipds/src/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="/nipds/src/custom.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body
    class="bg-slate-100 flex flex-col gap-6 items-center justify-center p-6 text-slate-800 selection:bg-violet-100 selection:text-violet-700 overflow-auto">

    <!-- Header -->
    <div class="w-full flex flex-col items-center md:flex-row gap-6 justify-between">
        <!-- Welcome section -->
        <div class="flex items-center gap-4 bg-white border border-slate-200 p-5 rounded-lg w-full">
            <!-- Avatar -->
            <div class="h-12 w-12 md:h-14 md:w-14 rounded-full bg-gradient-to-tr from-blue-500 to-blue-400 
               flex items-center justify-center text-white text-lg md:text-xl font-semibold shadow-sm">
                P
            </div>

            <!-- Text Content -->
            <div class="flex flex-col">
                <p class="text-base md:text-lg font-semibold text-slate-900 leading-snug">
                    Welcome, <span class="text-blue-600">Palomo</span>
                </p>
                <p class="text-sm text-slate-500 leading-snug">
                    Glad to see you back! Here’s your current status.
                </p>
            </div>
        </div>
    </div>

    <!-- StatCards -->
    <div id="cardContainer" class="cards grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full">
    </div>

    <!-- Data Tables -->
    <div class="w-full overflow-x-auto bg-white border border-slate-200 rounded-lg">
        <div class="p-5 font-semibold text-gray-700">Personnel Directory</div>

        <div
            class="p-5 bg-slate-50 border-t border-slate-200 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 items-center">

            <!-- Search -->
            <div class="relative lg:col-span-2">
                <input type="search" placeholder="Search by rank, name, serial number, or BOS" class="w-full border bg-white border-slate-300 p-2 rounded-md text-sm
             focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none
             transition-all duration-300" />
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4 text-slate-400 absolute right-3 top-1/2 -translate-y-1/2" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.5 5.5a7.5 7.5 0 0011.15 11.15z" />
                </svg>
            </div>

            <!-- Filters -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 lg:col-span-2">

                <!-- Category -->
                <select class="w-full bg-white border border-slate-300 p-2 rounded-md text-sm
             focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none
             transition-all duration-300">
                    <option value="">Category</option>
                    <option>Officers</option>
                    <option>Enlisted</option>
                    <option>Retirees</option>
                </select>

                <!-- Price Range -->
                <select class="w-full bg-white border border-slate-300 p-2 rounded-md text-sm
             focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none
             transition-all duration-300">
                    <option value="">Price Range</option>
                    <option>₱0–1000</option>
                    <option>₱1000–5000</option>
                    <option>₱5000+</option>
                </select>

                <!-- Sort By -->
                <select class="w-full bg-white border border-slate-300 p-2 rounded-md text-sm
             focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none
             transition-all duration-300">
                    <option value="">Sort By</option>
                    <option>Name (A–Z)</option>
                    <option>Name (Z–A)</option>
                    <option>Newest</option>
                    <option>Oldest</option>
                </select>

            </div>

            <!-- Buttons -->
            <div class="flex justify-start lg:justify-end gap-2">

                <!-- Export -->
                <button class="px-4 py-2 bg-blue-600 text-white text-sm rounded-md shadow-sm
             hover:bg-blue-700 transition-all duration-300 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
                    </svg>
                    Export
                </button>

                <!-- Print -->
                <button class="px-4 py-2 bg-slate-200 text-slate-700 text-sm rounded-md shadow-sm
             hover:bg-slate-300 transition-all duration-300 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 9V2h12v7M6 18h12v4H6v-4zM6 14h12M4 9h16v5H4V9z" />
                    </svg>
                    Print
                </button>

            </div>

        </div>


        <table class="min-w-full text-sm">
            <thead>
                <tr class="bg-slate-50 border-b border-t border-slate-200 text-xs uppercase text-slate-500">
                    <th class="px-4 py-3 text-left font-medium tracking-wider whitespace-nowrap">Personnel</th>
                    <th class="px-4 py-3 text-left font-medium tracking-wider whitespace-nowrap">Present Assignment</th>
                    <th class="px-4 py-3 text-left font-medium tracking-wider whitespace-nowrap">Present Unit</th>
                    <th class="px-4 py-3 text-left font-medium tracking-wider whitespace-nowrap">FOS & Rating</th>
                    <th class="px-4 py-3 text-left font-medium tracking-wider whitespace-nowrap">Field Duty</th>
                    <th class="px-4 py-3 text-center font-medium tracking-wider whitespace-nowrap">Action</th>
                </tr>
            </thead>

            </tbody>
        </table>
    </div>


    <!-- Scripts -->
    <script src="/nipds/src/js/Datatables.js"></script>
    <script src="/nipds/src/js/StatsCards.js"></script>
    <script src="/nipds/src/js/Dashboard.js"></script>
</body>

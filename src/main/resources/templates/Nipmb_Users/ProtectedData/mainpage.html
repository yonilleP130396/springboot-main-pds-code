           href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

    <style>
      
        /* Apply styles to all table cells */
        table#example td {
            padding: 8px 12px;         /* Example: add padding */
            text-align: left;           /* Align text to left */
            vertical-align: middle;     /* Align vertically in the middle */
            border: 1px solid #dee2e6; /* Optional: border like Bootstrap */
            font-size: 14px;
            width: 100px;            /* Set font size */
            /* You can add more styles here */
        }


        table.dataTable {
            border-collapse: collapse !important;
        }

        table.dataTable thead {
            background: #2c3e50;
            color: #ffffff;
        }

        table.dataTable thead th {
            padding: 14px 10px;
            font-weight: 500;
            border: none;
        }

        table.dataTable tbody tr {
            transition: background 0.2s ease;
        }

        table.dataTable tbody tr:hover {
            background: #f2f6fc;
        }

        table.dataTable tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid #eef1f5;
        }

        /* Column search inputs */
        table.dataTable thead input {
            width: 100%;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        table.dataTable thead input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 2px rgba(78,115,223,0.2);
        }

        /* Global search styling */
        .dataTables_filter input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            outline: none;
            margin-left: 8px;
        }

        .dataTables_filter input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 2px rgba(78,115,223,0.2);
        }

        /* Pagination styling */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 6px !important;
            padding: 5px 12px !important;
            margin: 2px;
            border: none !important;
            background: #f0f2f5 !important;
            color: #2c3e50 !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #4e73df !important;
            color: white !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: #dbe4ff !important;
            color: #2c3e50 !important;
        }

        /* Info text */
        .dataTables_info {
            margin-top: 15px;
            color: #6c757d;
        }

        /* Responsive */
        @media(max-width: 768px){
            .container{
                padding:20px;
            }
        }

       /* 
       para sa styling ng buttons 
       */
/* Target ALL DataTables Buttons */
.dt-buttons button.dt-button {
    background: linear-gradient(135deg, #1D6F42, #28a745) !important;
    color: #ffffff !important;
    border: none !important;
    padding: 8px 18px;
    margin-right: 8px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Hover Effect */
.dt-buttons button.dt-button:hover {
    background: linear-gradient(135deg, #166534, #218838) !important;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

  
    </style>
</head>

<body class="bg-light">

    <!-- Main content -->
    <main class="p-4">

        


        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="users-tab" data-bs-toggle="tab" data-bs-target="#orders"
                    type="button" role="tab">Unit Personnels</button>
            </li>
            
        </ul>

      

        <!-- Tab content -->
        <div class="tab-content" id="myTabContent">
            
            <div>
              <h3 class="p-3"></h3>
          
              <table id="example" class="table align-middle table-border">
                <thead class="table-light text-nowrap w-8rem">
                    <tr> <!-- Column titles -->
                        <th data-export="true">RANKCODE</th>
                        <th data-export="true">RANK</th>
                        <th data-export="true">FULL NAME</th>
                        <th data-export="true">AFPSN/BOS</th>
                        <th data-export="true">PRESENT ASSIGNMENT</th>
                        <th data-export="true">PRESENT UNIT</th>
                        <th data-export="true">FOS&RATING</th>
                        <th data-export="true">AUTHORITY</th>
                        <th data-export="true">FIELD DUTY</th>
                        <th data-export="true">SPECIALIZATION</th>
                        <th class="text-center">ACTIONS</th>
                    </tr>
                    <tr> <!-- Column search inputs -->
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                  <tr class="border" th:each="personneldata : ${protecteddata}">
                    <td
                      th:text="${personneldata.rankCode}">
                    </td>
                    <td
                      th:text="${personneldata.rank}">
                    </td>
                     <td
                      th:text="${personneldata.firstname+ ' '+personneldata.middlename+' '+personneldata.lastname+' '+personneldata.extension}">
                    </td>
                     <td
                      th:text="${personneldata.afpsn+' '+personneldata.bos.bosname}">
                    </td>
                    <td th:text="${personneldata.presentassignment}"></td>
                    <td th:text="${personneldata.unit.name}"></td>
                    <td th:text="${personneldata.fosRating.fosratingname}"></td>
                     <td th:text="${personneldata.authority}"></td>
                    <td th:text="${personneldata.fieldduty}"></td>
                    <td th:text="${#strings.contains(personneldata.afpsn, 'O-') ? personneldata.staffSpecialization : personneldata.subSpecialization}"></td>
                    <td class="text-center">
                      <div class="d-flex gap-2">
                         <!-- Show Details -->
                        <a th:href="@{/user/protecteddata/transferdata/{id}(id=${personneldata.id})}">
                          <button type="button" class="btn btn-default btn-sm">
                            <!--<a th:href="@{/protecteddata/edit/{id}(id=${personneldata.id})}">-->
                            <i class="fas fa-share"></i>
                          </button>
                        </a>
                        <a th:href="@{/user/personnelprofile/{id}/profile(id=${personneldata.id})}">
                          <button type="button" class="btn btn-default btn-sm">
                            <!--<a th:href="@{/protecteddata/edit/{id}(id=${personneldata.id})}">-->
                            <i class="fas fa-eye"></i>
                          </button>
                        </a>
                        <!-- Delete Record -->
                        <!-- <button type="button" class="btn btn-default btn-sm"
                          th:onclick="'confirmDeletePersonnel(' + ${personneldata.id} + ')'">
                          <i class="fas fa-trash-alt"></i>
                        </button> -->
                      </div>
                    </td>
                  </tr>
                </tbody>
            </table>
          </div>

            


        </div>
    </main>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script th:inline="javascript">
        function confirmDeletePersonnel(id) {
          const staticPassword = /*[[${appSecretKey} ?: '']]*/ '';
    
          Swal.fire({
            title: 'Are you sure?',
            text: "This will permanently delete the Personnel.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
          }).then((result) => {
            if (result.isConfirmed) {
              Swal.fire({
                title: 'Enter your Secret Key',
                input: 'password',
                inputPlaceholder: 'Enter your password',
                inputAttributes: {
                  autocapitalize: 'off',
                  autocorrect: 'off'
                },
                showCancelButton: true,
                confirmButtonText: 'Confirm',
                preConfirm: (inputPassword) => {
                  if (inputPassword !== staticPassword) {
                    Swal.showValidationMessage('Incorrect password');
                    return false;
                  }
                  return true;
                }
              }).then((result) => {
                if (result.isConfirmed) {
                  Swal.fire({
                    title: 'Deleting...',
                    text: 'Please wait while the personnel is being deleted.',
                    allowOutsideClick: false,
                    didOpen: () => {
                      Swal.showLoading();
                      window.location.href = `delete/${id}`;
                    }
                  });
                }
              });
            }
          });
        }
      </script>
    <script src="/js/security.js"></script>
    
    





<!-- DataTables JS -->
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>

<!-- Export Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <!-- Buttons -->
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
  

  <script>
    $(document).ready(function() {
        var table = $('#example').DataTable({
            ordering: false,
            fixedHeader: false,
            responsive: false,
            autoWidth: false,
            pageLength: 10,
            lengthMenu: [10, 25, 50, 100],
            dom: 'Bfrtip',
            buttons: [
                // Column visibility
                // {
                //     extend: 'colvis',
                //     text: '<i class="fa fa-eye"></i> Columns',
                //     className: 'btn btn-green',
                //     columns: ':not(:last-child)'
                // },
                // Excel
                {
                    extend: 'excelHtml5',
                    text: '<i class="fa fa-file-excel"></i> Excel',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    exportOptions: {
                        columns: ':visible:not(:last-child)'
                    }
                },
                // PDF
                {
                    extend: 'pdfHtml5',
                    text: '<i class="fa fa-file-pdf"></i> PDF',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    exportOptions: {
                        columns: ':visible:not(:last-child)'
                    }
                },
                // Print
                {
                    extend: 'print',
                    text: '<i class="fa fa-print"></i> Print',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    exportOptions: {
                        columns: ':visible:not(:last-child)'
                    }
                }
            ],
            columnDefs: [
                { orderable: false, targets: -1 },
                { searchable: false, targets: -1 }
            ]
        });
    
        // Column search functionality
        $('#example thead tr:eq(1) th').each(function(i) {
            $('input', this).on('keyup change clear', function() {
                if (table.column(i).search() !== this.value) {
                    table.column(i).search(this.value).draw();
                }
            });
        });
    });
    </script>
  

</body>

</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AdminLTE 2 | Advanced form elements</title>
  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <!-- Bootstrap 3.3.6 -->
  <link rel="stylesheet" href="/adminlte-2.3.10/bootstrap/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css">
  <!-- Ionicons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
  <!-- daterange picker -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/daterangepicker/daterangepicker.css">
  <!-- bootstrap datepicker -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/datepicker/datepicker3.css">
  <!-- iCheck for checkboxes and radio inputs -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/iCheck/all.css">
  <!-- Bootstrap Color Picker -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/colorpicker/bootstrap-colorpicker.min.css">
  <!-- Bootstrap time Picker -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/timepicker/bootstrap-timepicker.min.css">
  <!-- Select2 -->
  <link rel="stylesheet" href="/adminlte-2.3.10/plugins/select2/select2.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="/adminlte-2.3.10/dist/css/AdminLTE.min.css">
  <!-- AdminLTE Skins. Choose a skin from the css/skins
       folder instead of downloading all of them to reduce the load. -->
  <link rel="stylesheet" href="/adminlte-2.3.10/dist/css/skins/_all-skins.min.css">

  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->
</head>
<body>
<div>



  <!-- Content Wrapper. Contains page content -->
  <div >
    <!-- Content Header (Page header) -->
    <div class="container-fluid">
        <!--begin::Row-->
        <div class="row p-2 mt-2">
          <div class="col-sm-6 mt-2">
            <h3 class="mb-0">Transfer Personnel</h3>
          </div>
          <div class="col-sm-6 p-2" style="margin-top: 20px;">
            <ol class="breadcrumb pull-right  ">
              <li class="breadcrumb-item mt-2"><a th:href="@{/user/protecteddata/mainpage}">Home</a></li>
              <li class="breadcrumb-item active mt-2" aria-current="page">Transfer Personnel</li>
            </ol>
          </div>
        </div>
        <!--end::Row-->
    </div>

    <!-- Main content -->
    <section class="content">

        <div class="row">
            <!-- /.col -->
            <div class="col-md-12">
              <!-- Widget: user widget style 1 -->
              <div class="box box-widget widget-user">
                <!-- Add the bg color to the header using any of the bg-* classes -->
                <div class="widget-user-header bg-black" style="background: url('/adminlte-2.3.10/dist/img/photo1.png') center center;">
                  <h3 class="widget-user-username"><span
                    th:text="${personneldata.rankwithoutrating+ ' ' + personneldata.firstname+ ' '+personneldata.middlename+' '+personneldata.lastname+' '+personneldata.extension+' '+personneldata.afpsn+' '+personneldata.bos.bosname}"></span></h3>
                  <h5 class="widget-user-desc"><span
                    th:text="${personneldata.fosRating.fosratingname}"></span></h5>
                </div>
                <div class="widget-user-image">
                  <img class="img-circle" src="/images/profile.jpg" alt="User Avatar">
                </div>
                
                <div class="box-footer">
                    <div class="row">
                      <div class="col-sm-4 border-right">
                        <div class="description-block">
                          <h5 class="description-header"><span th:text="${T(java.time.LocalDate).parse(personneldata.dateEnterMilitaryService).format(T(java.time.format.DateTimeFormatter).ofPattern('MMM dd, yyyy'))}"></span> </h5>
                          <span class="description-text">Entered Military Service</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                      <div class="col-sm-4 border-right">
                        <div class="description-block">
                          <h5 class="description-header"><span th:text="${T(java.time.LocalDate).parse(personneldata.compulsoryRetirement).format(T(java.time.format.DateTimeFormatter).ofPattern('MMM dd, yyyy'))}"></span></h5>
                          <span class="description-text">Compulsary Retirement</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                      <div class="col-sm-4">
                        <div class="description-block">
                          <h5 class="description-header"><span th:text="${T(java.time.LocalDate).parse(personneldata.birthdate).format(T(java.time.format.DateTimeFormatter).ofPattern('MMM dd, yyyy'))}"></span></h5>
                          <span class="description-text">Birthday</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                    </div>
                    <!-- /.row -->
                </div>
                <div class="box-footer">
                    <div class="row">
                      <div class="col-sm-4 border-right">
                        <div class="description-block">
                          <h5 class="description-header"><span th:text="${personneldata.fieldduty}"></span></h5>
                          <span class="description-text">Field Duty</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                      <div class="col-sm-4 border-right">
                        <div class="description-block">
                          <h5 class="description-header"> <span class="text" th:text="${personneldata.sourceComms}"></span></h5>
                          <span class="description-text"> Source Commision</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                      <div class="col-sm-4">
                        <div class="description-block">
                          <h5 class="description-header"><span class="text" th:text="${personneldata.securityLevel.name}"></span></h5>
                          <span class="description-text">Security Level</span>
                        </div>
                        <!-- /.description-block -->
                      </div>
                      <!-- /.col -->
                    </div>
                    <!-- /.row -->
                  </div>
              </div>
              <!-- /.widget-user -->
            </div>
            <!-- /.col -->
          </div>
          <!-- /.row -->

      <div class="box box-default">
        <div class="box-header with-border">
          <h3 class="box-title">Move Personnel to:</h3>

          <div class="box-tools pull-right">
            <button type="button" class="btn btn-box-tool" data-widget="collapse"><i class="fa fa-minus"></i></button>
            <button type="button" class="btn btn-box-tool" data-widget="remove"><i class="fa fa-remove"></i></button>
          </div>
        </div>
        <!-- /.box-header -->
       
        <div class="box-body">
            <form th:action="@{/user/protecteddata/updateUserAccount}" method="post" id="transferForm">
              <div class="box-body">
                <div class="form-group">
                  <input type="hidden" th:value="${personneldata.id}" name="personnelId" />

                  <label>Office :</label>
                  <div class="input-group">
                    <select class="form-control select2" style="width: 100%;" name="userId" id="userId">
                      <option selected value="">Choose...</option>
                      <th:block th:each="office : ${offices}">
                        <option th:value="${office.id}"
                          th:selected="${personneldata != null and personneldata.userId != null and personneldata.userId.toString() == office.id.toString()}"
                          th:text="${office.name}">

                        </option>
                      </th:block>
                    </select>

                    <span class="input-group-btn">
                      <!-- Trigger modal instead of submitting -->
                      <button type="button" class="btn btn-primary btn-flat" data-toggle="modal" data-target="#confirmModal">Send</button>
                    </span>
                  </div>
                </div>
              </div>
            </form>

          </div>
          

    </div>
    </section>
    <!-- /.content -->
</div>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Confirm Transfer</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span>&times;</span>
        </button>
      </div>

      <div class="modal-body">
        Are you sure you want to transfer the personnel to a different office?
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <!-- This submits the form -->
        <button type="button" class="btn btn-primary" id="confirmSubmitBtn">Yes, Transfer</button>
      </div>

    </div>
  </div>
</div>

<!-- ./wrapper -->
<script>
  document.getElementById('confirmSubmitBtn').addEventListener('click', function () {
    document.getElementById('transferForm').submit();
  });
</script>


<!-- jQuery 2.2.3 -->
<script src="/adminlte-2.3.10/plugins/jQuery/jquery-2.2.3.min.js"></script>
<!-- Bootstrap 3.3.6 -->
<script src="/adminlte-2.3.10/bootstrap/js/bootstrap.min.js"></script>
<!-- Select2 -->
<script src="/adminlte-2.3.10/plugins/select2/select2.full.min.js"></script>
<!-- InputMask -->
<script src="/adminlte-2.3.10/plugins/input-mask/jquery.inputmask.js"></script>
<script src="/adminlte-2.3.10/plugins/input-mask/jquery.inputmask.date.extensions.js"></script>
<script src="/adminlte-2.3.10/plugins/input-mask/jquery.inputmask.extensions.js"></script>
<!-- date-range-picker -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.11.2/moment.min.js"></script>
<!-- SlimScroll 1.3.0 -->
<script src="/adminlte-2.3.10/plugins/slimScroll/jquery.slimscroll.min.js"></script>
<!-- FastClick -->
<script src="/adminlte-2.3.10/plugins/fastclick/fastclick.js"></script>
<!-- AdminLTE App -->
<script src="/adminlte-2.3.10/dist/js/app.min.js"></script>
<!-- AdminLTE for demo purposes -->
<script src="/adminlte-2.3.10/dist/js/demo.js"></script>
<!-- Page script -->

</body>
</html>

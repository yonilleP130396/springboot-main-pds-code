    <!--rankwithoutrating:script for dropdown-->
    <script>
        // Fetch the ranks from the Spring Boot REST API
        fetch('/api/rank')
            .then(response => response.json())
            .then(data => {
                let ranks = data;
                let rankSelect = document.getElementById("rank");

                // Populate the dropdown with rank names
                ranks.forEach(rank => {
                    let option = document.createElement("option");
                    option.value = rank.name;
                    option.textContent = rank.name;
                    rankSelect.appendChild(option);
                });
            });

        function updateRankWithoutRating() {
            var selectedRank = document.getElementById("rank").value;

            fetch('/api/rank')
                .then(response => response.json())
                .then(ranks => {
                    for (var i = 0; i < ranks.length; i++) {
                        if (ranks[i].name === selectedRank) {
                            document.getElementById("rankwithoutrating").value = ranks[i].rankwithoutrating;
                            break;
                        }
                    }
                });
        }
    </script>

    <div class="container-fluid">
        <!--begin::Row-->
        <div class="row">
            <div class="mw-100">
                <!-- begin: form-->
                <div class="card mb-4">
                    <div class="card-header"><h3 class="card-title" th:text="${militaryschooling.id == null ? 'Add Military Schooling' : 'Edit Military Schooling'}"></h3></div>
                    <!-- /.card-header -->
                    <div class="card-body">
                        <!--end::Header-->
                        <!--begin::Form-->
                        <div class="card card-info card-outline mb-4">
                            <!--begin::Header-->
                            <div class="card-header"><div class="card-title">Form</div></div>
                            <form th:action="@{/user/militaryschooling/{id}/save(id=${personneldata.id})}" th:object="${militaryschooling}" method="post">
                                <!--begin::Body-->
                                <div class="card-body">
                                    <input type="hidden" th:field="*{id}" />
                                    <input type="hidden" name="serialNumber"
                                           th:value="${militaryschooling.serialNumber != null and militaryschooling.serialNumber.id != null} ? ${militaryschooling.serialNumber.id} : ${personneldata.id}" />
                                    <div class="row g-3">
                                        
                                        <div class="col-md-4">
                                            <label for="unit" class="form-label fw-bold">Course Type :</label>
                                            <select class="form-select" id="coursetype" name="coursetype"  required>
                                                <option selected value="">Choose...</option>
                                                <th:block th:each="coursetype : ${coursetype}">
                                                    <option th:value="${coursetype.name}"
                                                            th:text="${coursetype.name}"
                                                            th:selected="${militaryschooling != null and militaryschooling.coursetype != null and militaryschooling.coursetype == coursetype.name}">
                                                    </option>
                                                </th:block>
                                            </select>
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Specialization Course :</label>

                                            <!-- Dropdown -->
                                            <select class="form-select" id="specializationDropdown" onchange="toggleSpecializationInput()" required>
                                                <option value="">Choose...</option>

                                                <!-- FIX: String na ang courseNames -->
                                                <th:block th:each="name : ${courseNames}">
                                                    <option th:value="${name.name}"
                                                            th:text="${name.name}"
                                                            th:selected="${militaryschooling.specializationcourse == name.name}">
                                                    </option>
                                                </th:block>

                                                <!-- OTHERS -->
                                                <option value="OTHERS"
                                                    th:selected="${militaryschooling.specializationcourse != null 
                                                    and !#lists.contains(courseNames, militaryschooling.specializationcourse)}">
                                                    OTHERS
                                                </option>
                                            </select>

                                            <!-- Input -->
                                            <input
                                                type="text"
                                                class="form-control mt-2"
                                                id="specializationInput"
                                                name="specializationcourse"
                                                th:value="${militaryschooling.specializationcourse}"
                                                placeholder="Enter specialization"
                                                pattern='^[a-zA-Z0-9ñÑ/# ]+$'
                                                style="display:none;"
                                            />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Course Taken :</label>
                                            <select class="form-select" id="highestcarreercourse" name="highestcarreercourse"  required>
                                                <option selected value="">Choose...</option>
                                                <th:block th:each="highcarreercourse : ${highcarreercourse}">
                                                    <option th:value="${highcarreercourse.name}"
                                                            th:text="${highcarreercourse.name}"
                                                            th:selected="${militaryschooling != null and militaryschooling.highestcarreercourse != null and militaryschooling.highestcarreercourse == highcarreercourse.name}">
                                                    </option>
                                                </th:block>
                                            </select>
                                        </div>

                                    </div>

                                    <div class="row g-3">
                                        
                                        <div class="col-md-4">
                                            <label for="unit" class="form-label fw-bold">School :</label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="school"
                                                    th:field="*{school}"
                                                    pattern='^[a-zA-Z0-9ñÑ/# ]+$' title="Only letters, numbers, spaces, #, /, and ñÑ are allowed"
                                                    required
                                            />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Authority :</label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="authority"
                                                    th:field="*{authority}"
                                                    pattern="^[a-zA-Z0-9#ñÑ/ ]+$"
                                                    title="Only Numbers, letters ,# , /."
                                                    required
                                            />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Class :</label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="classyear"
                                                    th:field="*{classyear}"
                                                    pattern="^[a-zA-Z0-9- ]+$"
                                                    title="Only Numbers and letters."
                                                    required
                                            />
                                        </div>
                                    </div>

                                    <div class="row g-3">
                                        
                                        <div class="col-md-4">
                                            <label for="unit" class="form-label fw-bold">Rating :</label>
                                            <input
                                                    type="text"
                                                    class="form-control"
                                                    id="rating"
                                                    th:field="*{rating}"
                                                    pattern='^[0-9.%]+$'
                                                    title="Only Numbers, dots and percent."
                                            />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Date Started :</label>
                                            <input
                                                    type="date"
                                                    class="form-control"
                                                    id="start"
                                                    th:field="*{start}"
                                                    required
                                            />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label fw-bold">Date End :</label>
                                            <input
                                                    type="date"
                                                    class="form-control"
                                                    id="end"
                                                    th:field="*{end}"
                                                     
                                            />
                                        </div>
                                    </div>

                                    <div class="row g-3">

                                        <div class="col-md-4">
                                            <label for="rank" class="form-label fw-bold">Remarks :</label>
                                            <select class="form-select" name="remarks" id="remarks" required>
                                                <option selected value="">Choose...</option>
                                                <th:block th:each="remarks : ${remarks}">
                                                    <option th:value="${remarks.name}"
                                                            th:text="${remarks.name}"
                                                           th:selected="${militaryschooling != null and militaryschooling.remarks != null and militaryschooling.remarks == remarks.name}">
                                                    </option>
                                                </th:block>
                                            </select>
                                        </div>

                                        <div class="col-md-4">
                                            <label for="rank" class="form-label fw-bold">Rank :</label>
                                            <select class="form-select" name="rank" id="rank" required>
                                                <option selected value="">Choose...</option>
                                                <th:block th:each="rank : ${ranks}">
                                                    <option th:value="${rank.name}"
                                                            th:text="${rank.name}"
                                                           th:selected="${militaryschooling != null and militaryschooling.rank != null and militaryschooling.rank == rank.name}">
                                                    </option>
                                                </th:block>
                                            </select>
                                        </div>

                                    </div>

                                </div>
                                <!--end::card Body-->
                                <!--begin::Footer-->
                                <div class="card-footer">
                                    <button class="btn btn-info float-end" type="submit">Submit Form</button>
                                </div>
                                <!--end::Footer-->
                            </form>

<script>
function toggleSpecializationInput() {
    const dropdown = document.getElementById("specializationDropdown");
    const input = document.getElementById("specializationInput");

    if (dropdown.value === "OTHERS") {
        input.style.display = "block";
        input.required = true;
    } else {
        input.style.display = "none";
        input.required = true;
        input.value = dropdown.value;
    }
}

window.addEventListener("load", function () {
    const dropdown = document.getElementById("specializationDropdown");
    const input = document.getElementById("specializationInput");

    let existsInDropdown = false;

    // check kung existing sa dropdown ang value
    for (let i = 0; i < dropdown.options.length; i++) {
        if (dropdown.options[i].value === input.value) {
            existsInDropdown = true;
            dropdown.value = input.value;
            break;
        }
    }

    // kung wala sa dropdown → set to OTHERS
    if (!existsInDropdown && input.value) {
        dropdown.value = "OTHERS";
    }

    toggleSpecializationInput();
});
</script>

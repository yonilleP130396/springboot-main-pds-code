              </div>
              <!-- /.card-header -->
              <div class="card-body table-responsive">
                <table id="example" class="table table-striped">
                  <thead>
                    <tr class="table-active">
                      <th>RANK/NAME/AFPSN/BOS</th>
                      <th>18 Months</th>
                      <th>54 Months</th>
                      <th>Encode Status</th>
                      <th>Encoder</th>
                    </tr>
                    </thead>
                    <tbody>
    
                      <tr th:each="personneldata : ${protecteddata}">
                        <td th:text="${personneldata.rank+ ' ' + personneldata.firstname+ ' '+personneldata.middlename+' '+personneldata.lastname+' '+personneldata.extension+' '+personneldata.afpsn+' '+personneldata.bosname}"></td>
                        
                        <td class="date-dd-mmm-yyyy" th:text="${personneldata.dateofmidtermenlistment}"></td>
                        <td class="date-dd-mmm-yyyy" th:text="${personneldata.dateofmidtermreenlistment}"></td>
                        <td th:text="${personneldata.reenlistmentstatus}"></td>
                        <td th:text="${personneldata.encoder}"></td>
                    </tr>
    
                    </tbody>
                  
                </table>
              </div>
              <!-- /.card-body -->
            </div>
            <!-- /.card -->
          </div>
          <!-- /.col -->

<script>
  $(function () {
    const table = $("#example").DataTable({
      stateSave: true,
      ordering: false,
      searching: true,
      pageLength: 50,
      lengthMenu: false,
      buttons: ["copy", "csv", "excel", "pdf", "print"]
    });

    // Create a wrapper div for the buttons and length menu
    const customToolbar = $('<div class="d-flex flex-wrap align-items-center justify-content-between mb-3 gap-2"></div>');

    // Append the buttons to the custom toolbar
    const buttons = table.buttons().container().addClass('me-2');
    customToolbar.append(buttons);

    
    // Insert the custom toolbar at the top
    $('#example_wrapper .row:first-child .col-md-6:eq(0)').html(customToolbar);

  });
</script>

</script>

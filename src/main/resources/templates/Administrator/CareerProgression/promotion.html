    <style>
      
        /* Apply styles to all table cells */
        table#example td {
            padding: 8px 12px;         /* Example: add padding */
            text-align: left;           /* Align text to left */
            vertical-align: middle;     /* Align vertically in the middle */
            border: 1px solid #dee2e6; /* Optional: border like Bootstrap */
            font-size: 14px;
            width: 100px;            /* Set font size */
            /* You can add more styles here */
        }


        table.dataTable {
            border-collapse: collapse !important;
        }

        table.dataTable thead {
            background: #2c3e50;
            color: #ffffff;
        }

        table.dataTable thead th {
            padding: 14px 10px;
            font-weight: 500;
            border: none;
        }

        table.dataTable tbody tr {
            transition: background 0.2s ease;
        }

        table.dataTable tbody tr:hover {
            background: #f2f6fc;
        }

        table.dataTable tbody td {
            padding: 12px 10px;
            border-bottom: 1px solid #eef1f5;
        }

        /* Column search inputs */
        table.dataTable thead input {
            width: 100%;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        table.dataTable thead input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 2px rgba(78,115,223,0.2);
        }

        /* Global search styling */
        .dataTables_filter input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            outline: none;
            margin-left: 8px;
        }

        .dataTables_filter input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 2px rgba(78,115,223,0.2);
        }

        /* Pagination styling */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 6px !important;
            padding: 5px 12px !important;
            margin: 2px;
            border: none !important;
            background: #f0f2f5 !important;
            color: #2c3e50 !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #4e73df !important;
            color: white !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: #dbe4ff !important;
            color: #2c3e50 !important;
        }

        /* Info text */
        .dataTables_info {
            margin-top: 15px;
            color: #6c757d;
        }

        /* Responsive */
        @media(max-width: 768px){
            .container{
                padding:20px;
            }
        }

       /* 
       para sa styling ng buttons 
       */
/* Target ALL DataTables Buttons */
.dt-buttons button.dt-button {
    background: linear-gradient(135deg, #1D6F42, #28a745) !important;
    color: #ffffff !important;
    border: none !important;
    padding: 8px 18px;
    margin-right: 8px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Hover Effect */
.dt-buttons button.dt-button:hover {
    background: linear-gradient(135deg, #166534, #218838) !important;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

<body class="bg-light">

  <div class="row p-2 mt-2">
    <div class="col-sm-6 mt-2">
      <h3 class="mb-0">PROMOTION MONITORING</h3>
    </div>
    <div class="col-sm-6">
      <ol class="breadcrumb float-sm-end">
        <li class="breadcrumb-item mt-2"><a th:href="@{/protecteddata/mainpage}">Home</a></li>
        <li class="breadcrumb-item active mt-2" aria-current="page">PROMOTION MONITORING</li>
      </ol>
    </div>
  </div>
    <!-- Main content -->
    <main class="p-4">


        <!-- Tab content -->
        <div>
            
            <div>
              <h3 class="p-3"></h3>
          
              <table id="example" class="table align-middle table-border">
                <thead class="table-light text-nowrap w-8rem">
                        <tr class="table-active">
                          <th>RANK/NAME/AFPSN/BOS</th>
                          <th>DATE OF LATEST PROMOTION</th>
                          <th>SUBMISSION OF PROMOTION FOLDER 1 YR.PRIOR TIG </th>
                          <th>TIME IN GRADE</th>
                          <th>TENURE IN GRADE</th>
                          <th>PROMEX EXAM REMINDER</th>
                          <th>UNIT/OFFICE ASSIGNMENT</th>
                        </tr>
                          <tr> <!-- Column search inputs -->
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              <th><input type="text" class="form-control form-control-sm column-search" data-export="false"></th>
                              
                          </tr>
                      </thead>
                      <tbody>
    
                        <tr th:each="personneldata : ${protecteddata}">
                          <td th:text="${personneldata.rank+ ' ' + personneldata.firstname+ ' '+personneldata.middlename+' '+personneldata.lastname+' '+personneldata.extension+' '+personneldata.afpsn+' '+personneldata.bos}"></td>
                          
                          
                          <td class="date-dd-mmm-yyyy" th:text="${personneldata.basePromotionDate}"></td>
                          <td class="date-dd-mmm-yyyy" th:text="${personneldata.submissionOfPromotion}"></td>
                          <td class="date-dd-mmm-yyyy" th:text="${personneldata.timeInGrade}"></td>
                          <td class="date-dd-mmm-yyyy" th:text="${personneldata.tenureInGrade}"></td>
                          <td class="date-dd-mmm-yyyy" th:text="${personneldata.dueForPromexExam}"></td>
                          <td  th:text="${personneldata.encoder}"></td>
                      </tr>
      
                      </tbody>
            </table>
          </div>

            


        </div>
    </main>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script th:inline="javascript">
        function confirmDeletePersonnel(id) {
          const staticPassword = /*[[${appSecretKey} ?: '']]*/ '';
    
          Swal.fire({
            title: 'Are you sure?',
            text: "This will permanently delete the Personnel.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Yes, delete it!'
          }).then((result) => {
            if (result.isConfirmed) {
              Swal.fire({
                title: 'Enter your Secret Key',
                input: 'password',
                inputPlaceholder: 'Enter your password',
                inputAttributes: {
                  autocapitalize: 'off',
                  autocorrect: 'off'
                },
                showCancelButton: true,
                confirmButtonText: 'Confirm',
                preConfirm: (inputPassword) => {
                  if (inputPassword !== staticPassword) {
                    Swal.showValidationMessage('Incorrect password');
                    return false;
                  }
                  return true;
                }
              }).then((result) => {
                if (result.isConfirmed) {
                  Swal.fire({
                    title: 'Deleting...',
                    text: 'Please wait while the personnel is being deleted.',
                    allowOutsideClick: false,
                    didOpen: () => {
                      Swal.showLoading();
                      window.location.href = `delete/${id}`;
                    }
                  });
                }
              });
            }
          });
        }
      </script>

  <script>
    $(document).ready(function() {
        var table = $('#example').DataTable({
            ordering: false,
            fixedHeader: false,
            responsive: false,
            autoWidth: false,
            pageLength: 10,
            lengthMenu: [10, 25, 50, 100],
            dom: 'Bfrtip',
            buttons: [
                // Column visibility
                // {
                //     extend: 'colvis',
                //     text: '<i class="fa fa-eye"></i> Columns',
                //     className: 'btn btn-green',
                //     columns: ':not(:last-child)'
                // },
                // Excel
                {
                    extend: 'excelHtml5',
                    text: '<i class="fa fa-file-excel"></i> Excel',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    
                },
                // PDF
                {
                    extend: 'pdfHtml5',
                    text: '<i class="fa fa-file-pdf"></i> PDF',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    
                },
                // Print
                {
                    extend: 'print',
                    text: '<i class="fa fa-print"></i> Print',
                    className: 'btn btn-green',
                    title: 'Personnel List Report',
                    
                }
            ],
            columnDefs: [
                { orderable: false, targets: -1 }
            ]
        });
    
        // Column search functionality
        $('#example thead tr:eq(1) th').each(function(i) {
            $('input', this).on('keyup change clear', function() {
                if (table.column(i).search() !== this.value) {
                    table.column(i).search(this.value).draw();
                }
            });
        });
    });
    </script>
  

</body>

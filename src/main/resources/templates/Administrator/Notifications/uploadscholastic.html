    /* Toast styles */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #4CAF50;
      color: #fff;
      text-align: center;
      border-radius: 5px;
      padding: 16px;
      position: fixed;
      z-index: 1;
      top: 20px;
      right: 20px;
      font-size: 17px;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateY(-20px);
    }
    .toast.show {
      visibility: visible;
      opacity: 1;

  </style>

    <!--rankwithoutrating:script for dropdown-->
    <script>
        // Fetch the ranks from the Spring Boot REST API
        fetch('/api/rank')
            .then(response => response.json())
            .then(data => {
                let ranks = data;
                let rankSelect = document.getElementById("rank");

                // Populate the dropdown with rank names
                ranks.forEach(rank => {
                    let option = document.createElement("option");
                    option.value = rank.name;
                    option.textContent = rank.name;
                    rankSelect.appendChild(option);
                });
            });

        function updateRankWithoutRating() {
            var selectedRank = document.getElementById("rank").value;

            fetch('/api/rank')
                .then(response => response.json())
                .then(ranks => {
                    for (var i = 0; i < ranks.length; i++) {
                        if (ranks[i].name === selectedRank) {
                            document.getElementById("rankwithoutrating").value = ranks[i].rankwithoutrating;
                            break;
                        }
                    }
                });
        }
    </script>

<div id="myToast" class="toast" th:text="${message}">Default toast message</div>

  <script>
    // Show toast on page load if message is present
    window.onload = function() {
      const toast = document.getElementById("myToast");
      // Only show if the toast has text (not empty)
      if (toast.textContent.trim().length > 0) {
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 5000); 
      }
    };
  </script>

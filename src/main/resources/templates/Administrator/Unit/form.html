<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${unit.id} == null ? 'Create Unit' : 'Edit Unit'">Unit Form</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1 th:text="${unit.id} == null ? 'Create Unit' : 'Edit Unit'"></h1>

    <form th:action="${unit.id} == null ? '/units' : '/units/update/' + ${unit.id}" 
          th:object="${unit}" method="post">
        <div>
            <label for="name">Unit Name:</label>
            <input type="text" id="name" th:field="*{name}" required />
        </div>


        <button type="submit">Save</button>
        <a href="/units">Cancel</a>
    </form>
</body>
</html>
